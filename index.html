<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<!-- Dark mode, if chosen on this device, before the first paint (js/theme.js keeps the choice). -->
<script>try { if (JSON.parse(localStorage.getItem('radiotext-theme')) === 'dark') { document.documentElement.dataset.theme = 'dark'; document.querySelector('meta[name=theme-color]').content = '#000000'; document.querySelector('meta[name=color-scheme]').content = 'dark'; } } catch (e) { /* no storage */ }</script>
<!-- SomaFM's stream servers answer 403 to any Referer they don't know, the site's own included. -->
<meta name="referrer" content="no-referrer">
<meta name="description" content="A radio for every genre, from pop hits and salsa to noise rock and sludge, with numbered pages like Teletext.">
<title>Radiotext</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Radiotext">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/PixelifySans.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="screen"><header id="hdr"></header><main id="page"></main><div id="pad" class="pad" hidden></div><nav id="fastext"></nav></div>
<audio id="radio" preload="none"></audio>
<script type="module" src="js/main.js"></script>
</body>
</html>
